# Repo-wide lint/format config. Applies to /backend, /jobs, /ml and /data.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "C4", "SIM"]
ignore = [
    # FastAPI's documented pattern is `Depends(...)` in argument defaults.
    "B008",
    # Steam's release strings are dates, not timestamps — no zone to attach.
    "DTZ007",
]

[lint.isort]
# Without this, `app` and `tests` get sorted as third-party, which puts the
# project's own imports above sqlalchemy's in some files and below in others.
known-first-party = ["app", "tests"]

[lint.per-file-ignores]
# Alembic generates these; leave its formatting and import order alone.
"backend/migrations/versions/*.py" = ["E501", "I001"]
"jobs/*.py" = ["E402"]
