[project]
name = "aaa-launch-predictor-backend"
version = "0.1.0"
description = "FastAPI backend for the AAA Game Launch Predictor (Phase 0: Steam ingestion)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "ruff>=0.9"]
# Only needed to *serve* a trained model. Without these the prediction
# endpoint falls back to the rule-based baseline and says so, which is also
# the current state of the project — no model has cleared its evaluation gate
# yet. See app/model_forecast.py.
ml = ["scikit-learn>=1.5", "numpy>=1.26", "joblib>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
