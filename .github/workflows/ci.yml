name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Curated dataset parses
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from app.backfill import load_curated_csv
          rows = load_curated_csv('data/historical_releases.csv')
          labeled = [r for r in rows if r.resolved_outcome]
          print(f'{len(rows)} rows, {len(labeled)} labeled')
          assert rows, 'curated CSV is empty'
          "

      - name: Rubric agrees with the hand labels
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from app.backfill import load_curated_csv
          rows = load_curated_csv('data/historical_releases.csv')
          labeled = [r for r in rows if r.resolved_outcome]
          missing = [r.game_name for r in labeled if r.studio_signal.value == 'unknown']
          assert not missing, f'labeled rows without a studio signal: {missing}'
          print(f'{len(labeled)} labeled rows, all carrying structured signals')
          "

      - name: Migrations match the models
        working-directory: backend
        env:
          # A throwaway SQLite file: `alembic check` needs somewhere to apply
          # the migrations before diffing them against the models.
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check

  ml:
    # Separate from the backend job on purpose. That one installs no
    # scientific stack, which is what proves the API still starts and still
    # serves baseline forecasts when scikit-learn is absent. This one installs
    # everything, so the model tests and the sklearn-gated serving tests
    # actually execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[dev,ml]' -r ml/requirements.txt

      - name: Model and evaluation tests
        run: pytest ml/tests -q

      - name: Backend tests, with the model stack present
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
