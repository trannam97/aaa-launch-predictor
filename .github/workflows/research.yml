name: Research

# Passes that propose curated values for a human to verify. Neither writes the
# database or the curated CSV — each uploads a review file you download, check,
# and copy from by hand. That is the whole point: these columns are curated
# because the obvious automated answer is wrong often enough to matter.
#
# Separate from Database (which writes) and Analysis (which reports to the step
# summary) because the deliverable here is a file, and because both cost money
# or quota per row.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which research pass to run"
        type: choice
        default: launch-prices
        options:
          - launch-prices
          - signal-drafts
      limit:
        # Not "leave blank for all": GitHub substitutes an input's default when
        # the field is submitted empty, so blank can only ever mean 20. The
        # whole queue needs a value of its own.
        description: "How many rows to process, or `all` for the whole queue (launch-prices, or signal-drafts in batch mode)."
        type: string
        default: "20"
      signal_mode:
        # Submit and collect are separate runs because a batch can take up to
        # 24 hours, and a runner blocked on a poll loop bills for every minute
        # of it. The batch id is the handle between them.
        description: "signal-drafts only — `now` calls per row and waits; `batch` queues the run at half the token cost; `collect` writes the file from a finished batch; `validate` measures the drafts against rows already labelled"
        type: choice
        default: now
        options:
          - now
          - batch
          - collect
          - validate
      batch_id:
        description: "signal-drafts + collect — the batch id the submit run printed"
        type: string
        default: ""
      appids:
        # Both jobs accept --appid; without a way to pass it from here, picking
        # a deliberate sample meant having a local Python toolchain, which is
        # the thing these workflows exist to avoid.
        description: "Research only these Steam appids, comma or space separated. Blank = the whole queue."
        type: string
        default: ""
      refresh:
        # The proposals file survives between runs (see the cache steps), which
        # is what makes a rate-limited run resumable. The same persistence keeps
        # a bad row alive forever, so there has to be a way to re-ask.
        description: "launch-prices only — re-ask about rows already proposed instead of continuing the queue"
        type: boolean
        default: false
      dump_raw:
        description: "launch-prices only — capture the first raw ITAD response to settle its shape"
        type: boolean
        default: false

# Two runs of the same pass would spend the quota twice for the same rows.
concurrency:
  group: research-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  launch-prices:
    if: inputs.job == 'launch-prices'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # No research extra: the ITAD client uses httpx, already a core dependency.
      - name: Install
        run: pip install -e './backend[postgres]'

      - uses: ./.github/actions/database-url
        with:
          url: ${{ secrets.DATABASE_URL }}

      # ITAD's allowance does not cover 170 games in one run — the first attempt
      # got 50 through and took HTTP 429 for the other 120. The job skips games
      # already in the proposals file, so carrying that file between runs is
      # what turns "re-run it" into progress instead of a repeat. The artifact
      # cannot do this (a run cannot read its predecessor's), and committing the
      # file would need write access to the branch; a cache needs neither.
      # Restored even for a refresh run: refresh means re-ask, not start over.
      # Dropping the file first would let `refresh` with a limit of 20 replace
      # fifty answered rows with twenty.
      - name: Restore the proposals so far
        uses: actions/cache/restore@v5
        with:
          path: data/launch_price_proposals.csv
          # The primary key never hits, which is the point: every run restores
          # the newest previous file and saves a fresh one under its own key.
          # run_attempt is in the key because run_id is *not* unique across
          # re-runs: a rate-limited attempt and the re-run that finishes the
          # queue share one run_id, so without it the second save collides with
          # the first and the cache keeps the shorter file.
          key: launch-price-proposals-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: launch-price-proposals-

      - name: Propose launch prices from ITAD
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          DUMP_RAW: ${{ inputs.dump_raw }}
          REFRESH: ${{ inputs.refresh }}
          APPIDS: ${{ inputs.appids }}
        run: |
          case "$LIMIT" in
            all) ;;
            ''|*[!0-9]*) echo "::error::limit must be a whole number or 'all': $LIMIT"; exit 1 ;;
          esac
          # tee succeeds even when the job exits non-zero, so without pipefail
          # a total failure reports green — which is exactly what the first run
          # of this workflow did.
          set -o pipefail
          args=()
          [ "$LIMIT" = "all" ] || args+=(--limit "$LIMIT")
          [ "$DUMP_RAW" = "true" ] && args+=(--dump-raw itad-history-shape.json)
          [ "$REFRESH" = "true" ] && args+=(--refresh)
          for id in ${APPIDS//,/ }; do
            case "$id" in
              *[!0-9]*|'') echo "::error::Not a numeric Steam appid: $id"; exit 1 ;;
              *) args+=(--appid "$id") ;;
            esac
          done
          status=0
          python jobs/backfill_launch_prices.py "${args[@]}" | tee prices.log || status=$?
          {
            echo "## Launch price proposals"
            echo
            echo '```'
            tail -14 prices.log
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo
              echo "The run stopped early. Everything it gathered is in the"
              echo "artifact and carried to the next run — re-run this workflow"
              echo "to continue the queue rather than repeat it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Saved even when the job failed: a run that spent its allowance halfway
      # still gathered real rows, and losing them is what made the first attempt
      # report 120 failures instead of 50 successes.
      - name: Carry the proposals to the next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/launch_price_proposals.csv
          key: launch-price-proposals-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the proposals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-price-proposals
          path: |
            data/launch_price_proposals.csv
            itad-history-shape.json
          if-no-files-found: warn

  signal-drafts:
    if: inputs.job == 'signal-drafts'
    runs-on: ubuntu-latest
    # A row takes 45-170 seconds, so 35 of them can reach 100 minutes and the
    # whole labelled set could be run more than once. The rows are written as
    # they arrive now, so a ceiling reached is no longer a run lost -- but the
    # ceiling was doing nothing useful at 90.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres,research]'

      - uses: ./.github/actions/database-url
        with:
          url: ${{ secrets.DATABASE_URL }}

      # One Claude call with web search per game. `now` bills a call per row
      # while the runner waits, so it refuses `all`; `batch` is the whole-queue
      # path and costs half as many token dollars, which is what `all` is for.
      - name: Draft studio and support signals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          MODE: ${{ inputs.signal_mode }}
          BATCH_ID: ${{ inputs.batch_id }}
          APPIDS: ${{ inputs.appids }}
        run: |
          args=()
          case "$MODE" in
            collect)
              [ -n "$BATCH_ID" ] || { echo "::error::collect needs the batch id the submit run printed"; exit 1; }
              args+=(--collect "$BATCH_ID")
              ;;
            batch)
              args+=(--batch)
              case "$LIMIT" in
                all) ;;
                ''|*[!0-9]*) echo "::error::limit must be a whole number or 'all': $LIMIT"; exit 1 ;;
                *) args+=(--limit "$LIMIT") ;;
              esac
              ;;
            validate)
              # Researches every row whose signals are already curated and
              # reports where the drafts disagree. The queue cannot test this:
              # every documented closure in the corpus is already labelled.
              args+=(--validate)
              ;;
            now)
              case "$LIMIT" in
                all) echo "::error::'all' bills a call per row with the runner waiting. Use signal_mode=batch for the whole queue — same work, half the token cost."; exit 1 ;;
                ''|*[!0-9]*) echo "::error::signal-drafts needs a numeric limit; each row costs a call"; exit 1 ;;
              esac
              args+=(--limit "$LIMIT")
              ;;
            *) echo "::error::unknown signal_mode: $MODE"; exit 1 ;;
          esac
          for id in ${APPIDS//,/ }; do
            case "$id" in
              *[!0-9]*|'') echo "::error::Not a numeric Steam appid: $id"; exit 1 ;;
              *) args+=(--appid "$id") ;;
            esac
          done
          set -o pipefail
          status=0
          python jobs/draft_studio_signals.py "${args[@]}" | tee drafts.log || status=$?
          {
            echo "## Signal drafts — $MODE"
            echo
            echo '```'
            tail -14 drafts.log
            echo '```'
            echo
            if [ "$MODE" = "batch" ]; then
              echo "Nothing is written yet. Re-run this workflow with **signal_mode: collect**"
              echo "and the batch id above once it has finished."
            elif [ "$MODE" = "validate" ]; then
              echo "Measurement, not a target. Fix a named error in a named row rather than"
              echo "tuning the prompt against these counts — and check whether a disagreement"
              echo "is the label rather than the draft."
            else
              echo "Drafts, not labels. Rows flagged **CLOSED-verify** must be read before use."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep the drafts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signal-drafts
          path: |
            data/signal_drafts.csv
            data/signal_validation.csv
          if-no-files-found: warn
