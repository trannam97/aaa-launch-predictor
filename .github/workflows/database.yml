name: Database

# The one-time setup that turns an empty Supabase project into a working
# database, run from the Actions tab so no local Python toolchain is needed.
#
# Two steps, deliberately separate: a migration failure should not burn an
# hour of Steam fetching, and re-running migrations later should not re-load
# the corpus. Pick one, or "migrate-then-backfill" for a first run.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which step to run"
        type: choice
        default: migrate
        options:
          - migrate
          - backfill
          - migrate-then-backfill
      dry_run:
        description: "Backfill only — fetch and report, write nothing"
        type: boolean
        default: false
      appids:
        description: "Backfill only these Steam appids, comma or space separated. Blank = all 206."
        type: string
        default: ""

# Never let two of these overlap; both write to the same database.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.action != 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres]'

      # app/config.py rewrites postgresql:// to postgresql+psycopg:// at
      # runtime, and GitHub only redacts the *exact* secret string it stores.
      # So the rewritten URL would print unmasked if anything ever logged it.
      # Normalising here and re-masking both the whole URL and the password
      # closes that hole whichever scheme the secret happens to carry.
      - name: Normalise and mask the connection string
        env:
          RAW: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys

          raw = os.environ.get("RAW", "").strip()
          if not raw:
              sys.exit("The DATABASE_URL secret is empty or missing.")

          # app/config.py does this at runtime, but GitHub only redacts the
          # exact string it stores, so the rewritten URL would print unmasked.
          for old in ("postgresql://", "postgres://"):
              if raw.startswith(old):
                  raw = "postgresql+psycopg://" + raw[len(old) :]
                  break

          # Register every credential fragment BEFORE anything can fail and
          # print one. Order matters: a mask added after the leak is too late.
          def mask(value: str) -> None:
              if len(value) >= 4:
                  print(f"::add-mask::{value}")

          mask(raw)
          after = raw.split("://", 1)[1] if "://" in raw else ""
          userinfo, sep, host = after.rpartition("@")
          if sep:
              mask(userinfo)
              if ":" in userinfo:
                  password = userinfo.split(":", 1)[1]
                  mask(password)
                  # Whatever splits on the first @ rather than the last sees
                  # only this much; mask it too.
                  mask(password.split("@", 1)[0])

          if not sep or not host:
              sys.exit("DATABASE_URL is not a valid connection string.")

          # An unencoded '@' in the password makes the URL ambiguous. psycopg
          # folds the tail into the hostname and prints the whole thing in its
          # resolver error — which is how a password reaches a build log.
          if "@" in userinfo:
              sys.exit(
                  "The password in DATABASE_URL contains an unencoded '@'.\n"
                  "Percent-encode it before storing the secret:\n"
                  "  @ -> %40   : -> %3A   / -> %2F   % -> %25   ? -> %3F   # -> %23\n"
                  "Or reset the database password in Supabase and let it generate an\n"
                  "alphanumeric one, which needs no encoding.\n"
                  "Nothing was printed and no connection was attempted."
              )

          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"DATABASE_URL={raw}\n")
          print("Connection string normalised, validated and masked.")
          PY

      - name: Create or update the tables
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      - name: Report
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import create_engine, inspect
          from app.config import get_settings
          insp = inspect(create_engine(get_settings().sqlalchemy_url))
          names = sorted(insp.get_table_names())
          print(f"### Schema ready — {len(names)} tables\n")
          print("\n".join(f"- `{n}`" for n in names))
          PY

  backfill:
    needs: [migrate]
    # Runs when migrate succeeded, or was skipped because only backfill was
    # asked for. Never after a failed migration — the tables would be wrong.
    if: >-
      always() && inputs.action != 'migrate'
      && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres]'

      - name: Normalise and mask the connection string
        env:
          RAW: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys

          raw = os.environ.get("RAW", "").strip()
          if not raw:
              sys.exit("The DATABASE_URL secret is empty or missing.")

          # app/config.py does this at runtime, but GitHub only redacts the
          # exact string it stores, so the rewritten URL would print unmasked.
          for old in ("postgresql://", "postgres://"):
              if raw.startswith(old):
                  raw = "postgresql+psycopg://" + raw[len(old) :]
                  break

          # Register every credential fragment BEFORE anything can fail and
          # print one. Order matters: a mask added after the leak is too late.
          def mask(value: str) -> None:
              if len(value) >= 4:
                  print(f"::add-mask::{value}")

          mask(raw)
          after = raw.split("://", 1)[1] if "://" in raw else ""
          userinfo, sep, host = after.rpartition("@")
          if sep:
              mask(userinfo)
              if ":" in userinfo:
                  password = userinfo.split(":", 1)[1]
                  mask(password)
                  # Whatever splits on the first @ rather than the last sees
                  # only this much; mask it too.
                  mask(password.split("@", 1)[0])

          if not sep or not host:
              sys.exit("DATABASE_URL is not a valid connection string.")

          # An unencoded '@' in the password makes the URL ambiguous. psycopg
          # folds the tail into the hostname and prints the whole thing in its
          # resolver error — which is how a password reaches a build log.
          if "@" in userinfo:
              sys.exit(
                  "The password in DATABASE_URL contains an unencoded '@'.\n"
                  "Percent-encode it before storing the secret:\n"
                  "  @ -> %40   : -> %3A   / -> %2F   % -> %25   ? -> %3F   # -> %23\n"
                  "Or reset the database password in Supabase and let it generate an\n"
                  "alphanumeric one, which needs no encoding.\n"
                  "Nothing was printed and no connection was attempted."
              )

          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"DATABASE_URL={raw}\n")
          print("Connection string normalised, validated and masked.")
          PY

      # Paced by SteamClient's own 1.5s minimum request interval, so this is
      # slow by design: roughly 40-90 minutes for the full corpus.
      # Inputs arrive through the environment rather than being interpolated
      # into the script text: a ${{ }} expansion of a free-text input is a
      # shell-injection vector. Each appid is checked numeric before use.
      - name: Load the corpus
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APPIDS: ${{ inputs.appids }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          for id in ${APPIDS//,/ }; do
            case "$id" in
              *[!0-9]*|'') echo "::error::Not a numeric Steam appid: $id"; exit 1 ;;
              *) args+=(--appid "$id") ;;
            esac
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "Backfilling the whole corpus."
          else
            echo "Arguments: ${args[*]}"
          fi
          python jobs/backfill_historical.py "${args[@]}"

      - name: Report
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import create_engine, func, select
          from sqlalchemy.orm import Session
          from app.config import get_settings
          from app.models import HistoricalRelease
          with Session(create_engine(get_settings().sqlalchemy_url)) as s:
              total = s.scalar(select(func.count()).select_from(HistoricalRelease))
              labeled = s.scalar(
                  select(func.count()).select_from(HistoricalRelease)
                  .where(HistoricalRelease.resolved_outcome.is_not(None))
              )
          print(f"### Corpus loaded\n\n- **{total}** releases\n- **{labeled}** carrying a label")
          PY
