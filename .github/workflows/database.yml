name: Database

# The one-time setup that turns an empty Supabase project into a working
# database, run from the Actions tab so no local Python toolchain is needed.
#
# Steps are deliberately separate: a migration failure should not burn an hour
# of Steam fetching, and re-running migrations later should not reload the
# corpus. Pick one, or "migrate-then-backfill" for a first run.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which step to run"
        type: choice
        default: migrate
        options:
          - migrate
          - backfill
          - migrate-then-backfill
          - detect-launch-start
      dry_run:
        description: "backfill and detect-launch-start — report without writing anything"
        type: boolean
        default: false
      appids:
        description: "Backfill only these Steam appids, comma or space separated. Blank = all 206."
        type: string
        default: ""

# Never let two of these overlap; both write to the same database.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.action == 'migrate' || inputs.action == 'migrate-then-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres]'

      # app/config.py rewrites postgresql:// to postgresql+psycopg:// at
      # runtime, and GitHub only redacts the *exact* secret string it stores.
      # So the rewritten URL would print unmasked if anything ever logged it.
      # Normalising here and re-masking both the whole URL and the password
      # closes that hole whichever scheme the secret happens to carry.
      - uses: ./.github/actions/database-url
        with:
          url: ${{ secrets.DATABASE_URL }}

      - name: Create or update the tables
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      - name: Report
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import create_engine, inspect
          from app.config import get_settings
          insp = inspect(create_engine(get_settings().sqlalchemy_url))
          names = sorted(insp.get_table_names())
          print(f"### Schema ready — {len(names)} tables\n")
          print("\n".join(f"- `{n}`" for n in names))
          PY

  backfill:
    needs: [migrate]
    # Runs when migrate succeeded, or was skipped because only backfill was
    # asked for. Never after a failed migration — the tables would be wrong.
    if: >-
      always() && (inputs.action == 'backfill' || inputs.action == 'migrate-then-backfill')
      && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres]'

      - uses: ./.github/actions/database-url
        with:
          url: ${{ secrets.DATABASE_URL }}

      # Paced by SteamClient's own 1.5s minimum request interval, so this is
      # slow by design: roughly 40-90 minutes for the full corpus.
      # Inputs arrive through the environment rather than being interpolated
      # into the script text: a ${{ }} expansion of a free-text input is a
      # shell-injection vector. Each appid is checked numeric before use.
      - name: Load the corpus
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APPIDS: ${{ inputs.appids }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          for id in ${APPIDS//,/ }; do
            case "$id" in
              *[!0-9]*|'') echo "::error::Not a numeric Steam appid: $id"; exit 1 ;;
              *) args+=(--appid "$id") ;;
            esac
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "Backfilling the whole corpus."
          else
            echo "Arguments: ${args[*]}"
          fi
          python jobs/backfill_historical.py "${args[@]}"

      - name: Report
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import create_engine, func, select
          from sqlalchemy.orm import Session
          from app.config import get_settings
          from app.models import HistoricalRelease
          with Session(create_engine(get_settings().sqlalchemy_url)) as s:
              total = s.scalar(select(func.count()).select_from(HistoricalRelease))
              labeled = s.scalar(
                  select(func.count()).select_from(HistoricalRelease)
                  .where(HistoricalRelease.resolved_outcome.is_not(None))
              )
          print(f"### Corpus loaded\n\n- **{total}** releases\n- **{labeled}** carrying a label")
          PY

  # Opening the window at 1.0 rather than the store date is a correction the
  # project has measured but never applied to a real database: it costs the
  # rubric 6.3 points of exact agreement, from 96.9% down to 90.6%, because a
  # correct window is harder to score than a convenient one. Until this runs,
  # launch_window_start is null everywhere and every window measures from the
  # store date.
  #
  # Writing the date is only half the job — the windows already stored were
  # measured from the old start, so the shifted rows are re-backfilled here
  # rather than left for someone to remember.
  detect-launch-start:
    if: inputs.action == 'detect-launch-start'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e './backend[postgres]'

      - uses: ./.github/actions/database-url
        with:
          url: ${{ secrets.DATABASE_URL }}

      - name: Find launches that began before the store date
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          status=0
          python jobs/detect_launch_start.py "${args[@]}" > detect.txt || status=$?
          cat detect.txt
          {
            echo "## Launch-window detection"
            echo
            echo '```'
            cat detect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Which rows moved is a database question, not a log-parsing one: any
      # row now carrying launch_window_start has windows measured from the
      # wrong start and needs re-measuring.
      - name: Re-measure the rows whose window moved
        if: ${{ !inputs.dry_run }}
        run: |
          python - <<'PY' > shifted.args
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.config import get_settings
          from app.models import HistoricalRelease
          with Session(create_engine(get_settings().sqlalchemy_url)) as s:
              ids = s.scalars(
                  select(HistoricalRelease.steam_appid)
                  .where(HistoricalRelease.launch_window_start.is_not(None))
                  .order_by(HistoricalRelease.steam_appid)
              ).all()
          print(" ".join(f"--appid {i}" for i in ids))
          PY
          # `read` returns non-zero at EOF, which under bash -e would abort
          # the step and hide whatever actually went wrong upstream.
          args=()
          read -r -a args < shifted.args || true
          if [ ${#args[@]} -eq 0 ]; then
            echo "No rows shifted; nothing to re-measure."
            echo "## Re-measure" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No rows shifted, so no windows needed recomputing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Re-backfilling $(( ${#args[@]} / 2 )) shifted row(s)."
          python jobs/backfill_historical.py "${args[@]}" > remeasure.txt
          tail -40 remeasure.txt
          {
            echo "## Re-measured $(( ${#args[@]} / 2 )) shifted row(s)"
            echo
            echo '```'
            tail -40 remeasure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
